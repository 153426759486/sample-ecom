name: Deploy Spring Boot to Elastic Beanstalk

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================

      - name: Checkout code
        uses: actions/checkout@v4

      # =========================
      # JAVA / BACKEND
      # =========================

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # =========================
      # NODE / FRONTEND
      # =========================

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # =========================
      # BUILD BACKEND
      # =========================

      - name: Build Spring Boot application
        run: mvn clean package -DskipTests

      # =========================
      # DEBUG
      # =========================

      - name: Debug GitHub context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Repository ID: ${{ github.repository_id }}"
          echo "Owner ID: ${{ github.repository_owner_id }}"

      # =========================
      # AWS CREDENTIALS
      # =========================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # =========================
      # FRONTEND DEPLOYMENT
      # =========================

      - name: Upload frontend to S3
        run: |
          aws s3 sync frontend/build/ s3://sample-ecom-frontend-aman-2026 --delete

      # =========================
      # BACKEND DEPLOYMENT
      # =========================

      - name: Create deployment package
        run: |
          mkdir deploy
          cp target/*.jar deploy/application.jar
          cd deploy
          zip ../application.zip application.jar

      - name: Upload package to S3
        run: |
          aws s3 cp application.zip \
            s3://elasticbeanstalk-ap-south-1-560428233896/application-${GITHUB_SHA}.zip

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name sample-ecom \
            --version-label ${GITHUB_SHA} \
            --source-bundle S3Bucket=elasticbeanstalk-ap-south-1-560428233896,S3Key=application-${GITHUB_SHA}.zip

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --application-name sample-ecom \
            --environment-name sample-ecom-env \
            --version-label ${GITHUB_SHA}